name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NIX_PATH: nixpkgs=channel:nixos-unstable

jobs:
  format:
    name: Format checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: ${{ env.NIX_PATH }}

      - name: Check Nix formatting
        run: nix develop -c alejandra --check .

      - name: Check source formatting and lint
        run: nix develop -c npm run lint

  build-and-audit:
    name: Build, typecheck and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: ${{ env.NIX_PATH }}

      - name: Install locked dependencies
        run: nix develop -c npm ci

      - name: Typecheck
        run: nix develop -c npx tsc --noEmit

      - name: Dependency audit
        run: nix develop -c npm audit --audit-level=high

      - name: Production build
        run: nix develop -c npm run build

  docker:
    name: Build production container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [format, build-and-audit]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build container
        run: docker build --pull --tag ghostty-website:ci-${{ github.sha }} .
