name: Security Lockfile Repair

on:
  push:
    branches:
      - fix/ci-biome-install-and-audit

permissions:
  contents: write

concurrency:
  group: security-lockfile-repair-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    name: Apply semver-compatible npm security fixes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Update lockfile without force or lifecycle scripts
        shell: bash
        run: |
          set +e
          nix develop -c npm audit fix --package-lock-only --ignore-scripts --no-fund
          audit_fix_status=$?
          set -e
          echo "npm_audit_fix_exit_code=$audit_fix_status" >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet -- package-lock.json; then
            echo "No compatible lockfile updates were produced." >> "$GITHUB_STEP_SUMMARY"
            exit "$audit_fix_status"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): apply compatible npm security updates"
          git push origin "HEAD:${GITHUB_REF_NAME}"
